# @package _global_

# DPPO adaptation for this project's from-scratch IsaacLab protocol.
# The official manipulation experiments fine-tune a pretrained diffusion
# policy; use algo=dppo for the official-style random-epsilon baseline.
algo:
  name: dppo_scratch
  num_envs: 1024
  rollout_length: 24
  backbone_cls: residual_mlp
  critic_hidden_dims: [256, 256, 256]
  critic_activation: mish
  actor_lr: 0.0001
  critic_lr: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  gamma_denoising: 1.0
  clip_epsilon: 0.1
  clip_epsilon_base: 0.1
  clip_epsilon_rate: 3.0
  critic_loss_coeff: 0.5
  reward_scaling: 1.0
  reward_scale_running: true
  reward_scale_clip: 10.0
  normalize_advantage: true
  # Keep the environment-transition contract identical to PPO/FPO.
  num_minibatches: 4
  num_epochs: 10
  batch_size: 6144
  clip_grad_norm: null
  critic_warmup_rollouts: 2
  diffusion:
    hidden_dims: [512, 512, 512]
    activation: relu
    time_dim: 16
    steps: 10
    noise_schedule: cosine
    clip_sampler: true
    x_min: -1.0
    x_max: 1.0
    solver: ddpm
    min_sampling_denoising_std: 0.1
    min_logprob_denoising_std: 0.1
    randn_clip_value: 3.0
    eval_zero_xT: false
