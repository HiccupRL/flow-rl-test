# @package _global_

algo:
  name: dppo
  num_envs: 32
  rollout_length: 256
  backbone_cls: residual_mlp
  critic_hidden_dims: [256, 256, 256]
  critic_activation: mish
  actor_lr: 0.0001
  critic_lr: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  gamma_denoising: 1.0
  clip_epsilon: 0.1
  clip_epsilon_base: 0.1
  clip_epsilon_rate: 3.0
  critic_loss_coeff: 0.5
  reward_scaling: 1.0
  reward_scale_running: true
  reward_scale_clip: 10.0
  normalize_advantage: true
  # Match the environment-transition minibatch contract used by PPO/FPO.
  num_minibatches: 8
  num_epochs: 10
  batch_size: 1024
  clip_grad_norm: null
  diffusion:
    hidden_dims: [512, 512, 512]
    activation: relu
    time_dim: 16
    steps: 10
    noise_schedule: cosine
    clip_sampler: true
    x_min: -1.0
    x_max: 1.0
    solver: ddpm
    min_sampling_denoising_std: 0.1
    min_logprob_denoising_std: 0.1
    randn_clip_value: 3.0
    eval_zero_xT: false
